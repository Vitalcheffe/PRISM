<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:400px;background:#0d1117;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif}
.wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(245,158,11,0.05) 1px,transparent 1px);background-size:32px 32px;opacity:0.6}
.name{position:relative;z-index:1;text-align:center}
.name h1{font-size:120px;font-weight:700;letter-spacing:-0.06em;color:#f0f6fc;line-height:1}
.name .line{width:0;height:1px;background:#f0f6fc;margin:24px auto;animation:grow 1.2s cubic-bezier(0.16,1,0.3,1) 0.3s forwards}
.name .sub{font-size:16px;color:#8b949e;font-weight:400;letter-spacing:0.02em;opacity:0;animation:fade 0.8s ease 1s forwards}
.name .stats{display:flex;gap:32px;justify-content:center;margin-top:28px;opacity:0;animation:fade 0.8s ease 1.2s forwards}
.name .stat{font-size:13px;color:#6e7681;font-family:'SF Mono',monospace;letter-spacing:0.06em}
@keyframes grow{to{width:64px}}
@keyframes fade{to{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
<div class="dots"></div>
<div class="name">
<h1>PRISM</h1>
<div class="line"></div>
<div class="sub">Non-linear macroeconomic simulator</div>
<div class="stats">
<span class="stat">3,008 weights</span>
<span class="stat">10,000 agents</span>
<span class="stat">47 levers</span>
<span class="stat">8 factions</span>
</div>
</div>
</div>
</body>
</html>
